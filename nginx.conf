server {
  listen ${PORT};
  server_name _;
  absolute_redirect off;
  port_in_redirect off;

  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /install.sh {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /install.sh =404;
  }

  location = /install.ps1 {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /install.ps1 =404;
  }

  location = /install {
    default_type text/html;
    add_header Cache-Control "no-cache";
    try_files /install/index.html =404;
  }

  location = /install/ {
    default_type text/html;
    add_header Cache-Control "no-cache";
    try_files /install/index.html =404;
  }

  location = /install/commands.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files /install/commands.json =404;
  }

  location = /install/checksums.txt {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /install/checksums.txt =404;
  }

  location = /install/checksums.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
    try_files /install/checksums.json =404;
  }

  location = /docs {
    default_type text/html;
    add_header Cache-Control "no-cache";
    try_files /docs/index.html =404;
  }

  location = /docs/ {
    default_type text/html;
    add_header Cache-Control "no-cache";
    try_files /docs/index.html =404;
  }

  location = /docs/AGENTS.md {
    default_type text/markdown;
    add_header Cache-Control "no-cache";
    try_files /docs/AGENTS.md =404;
  }

  location = /docs/llms.txt {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /docs/llms.txt =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "no-cache";
    try_files /sitemap.xml =404;
  }

  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "no-cache";
    try_files /robots.txt =404;
  }

  location ~* \.glb$ {
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
