server {
  listen ${PORT};
  server_name _;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  root /usr/share/nginx/html;
  index index.html;
  if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-DCWk2Wgl2Ksl5EjYb5Iey+STNYK8OZxHERLYRw0cC3c='; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location = /index.html {
    expires -1;
    try_files /index.html =404;
  }

  location ~* \.(css|js)$ {
    expires 1h;
    try_files $uri =404;
  }

  location = /install.sh {
    default_type text/plain;
    expires -1;
    try_files /install.sh =404;
  }

  location = /install.ps1 {
    default_type text/plain;
    expires -1;
    try_files /install.ps1 =404;
  }

  location = /install {
    default_type text/html;
    expires -1;
    try_files /install/index.html =404;
  }

  location = /install/ {
    default_type text/html;
    expires -1;
    try_files /install/index.html =404;
  }

  location = /install/commands.json {
    default_type application/json;
    expires -1;
    try_files /install/commands.json =404;
  }

  location = /install/checksums.txt {
    default_type text/plain;
    expires -1;
    try_files /install/checksums.txt =404;
  }

  location = /install/checksums.json {
    default_type application/json;
    expires -1;
    try_files /install/checksums.json =404;
  }

  location = /install/attestations.md {
    default_type text/markdown;
    expires -1;
    try_files /install/attestations.md =404;
  }

  location = /install/release-manifest.json {
    default_type application/json;
    expires -1;
    try_files /install/release-manifest.json =404;
  }

  location = /docs {
    default_type text/html;
    expires -1;
    try_files /docs/index.html =404;
  }

  location = /docs/ {
    default_type text/html;
    expires -1;
    try_files /docs/index.html =404;
  }

  location = /docs/AGENTS.md {
    default_type text/markdown;
    expires -1;
    try_files /docs/AGENTS.md =404;
  }

  location = /docs/llms.txt {
    default_type text/plain;
    expires -1;
    try_files /docs/llms.txt =404;
  }

  location = /docs/install-safety.md {
    default_type text/markdown;
    expires -1;
    try_files /docs/install-safety.md =404;
  }

  location = /docs/lifecycle.md {
    default_type text/markdown;
    expires -1;
    try_files /docs/lifecycle.md =404;
  }

  location = /docs/lore.config.json {
    default_type application/json;
    expires -1;
    try_files /docs/lore.config.json =404;
  }

  location ^~ /docs/pages/ {
    default_type text/markdown;
    expires -1;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    expires -1;
    try_files /sitemap.xml =404;
  }

  location = /robots.txt {
    default_type text/plain;
    expires -1;
    try_files /robots.txt =404;
  }

  location = /SECURITY.md {
    default_type text/markdown;
    expires -1;
    try_files /SECURITY.md =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    expires -1;
    try_files /.well-known/security.txt =404;
  }

  location ~* \.glb$ {
    default_type model/gltf-binary;
    expires 30d;
    try_files $uri =404;
  }

  location ~* \.(webp|png|jpg|jpeg|svg|ico)$ {
    expires 30d;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
