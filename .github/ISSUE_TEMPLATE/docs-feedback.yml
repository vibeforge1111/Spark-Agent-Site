name: Spark feedback
description: Tell us where Spark docs, install, setup, or a module felt confusing.
title: "Spark feedback: "
labels:
  - docs
  - onboarding
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us make Spark easier to install, use, and improve.
        Please do not paste API keys, Telegram bot tokens, private logs, or personal secrets.
  - type: dropdown
    id: repo
    attributes:
      label: Best target repo
      description: Pick the repo or module this feedback most likely belongs to.
      options:
        - Spark-Agent-Site: docs, install page, hosted metadata
        - spark-cli: installer, setup, providers, autostart, commands
        - spark-researcher: research, OTOLO/autoloops, chip authoring
        - spark-intelligence-builder: runtime routing and provider roles
        - domain-chip-memory: memory and memory benchmarks
        - spark-telegram-bot: Telegram chat and commands
        - vibeship-spawner-ui: Mission Control, Kanban, Canvas
        - spark-character: role, voice, permissions
        - spark-skill-graphs: domain chips and skill graphs
        - Not sure
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page, command, module, or repo
      description: Which page, command, module, repo, or step were you using?
      placeholder: "Example: /docs/commands/, spark live start, spark-researcher autoloop, Telegram /diagnose"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: What got confusing?
      options:
        - Installer or upgrade
        - Registration / onboarding page
        - LLM/provider setup
        - Telegram bot setup
        - Commands or where to type them
        - Mission Control / Kanban / Canvas
        - Memory or domain chips
        - Researcher / OTOLO / autoloops
        - Benchmark or score behavior
        - Pull request or contribution path
        - Security or permissions
        - Other docs wording
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected the page to tell me..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: "Instead I got stuck at..."
    validations:
      required: true
  - type: textarea
    id: safe_details
    attributes:
      label: Safe details
      description: Share commands, screenshots, or error text after removing secrets.
      placeholder: "Paste redacted output here. Replace tokens with <redacted>."
    validations:
      required: false
  - type: textarea
    id: suggested_fix
    attributes:
      label: Suggested improvement or PR link
      description: Optional. Share the smallest change you think would help, or link a PR if you opened one.
      placeholder: "A clearer sentence, command example, test, diagram, or PR link would be..."
    validations:
      required: false
